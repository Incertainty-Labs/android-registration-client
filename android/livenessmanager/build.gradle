plugins {
    id 'com.android.library'
}

apply from: '../jacoco.gradle'

android {
    lintOptions {
        abortOnError false
        ignoreWarnings true
    }
    namespace 'io.mosip.registration.livenessmanager'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            testCoverageEnabled true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildToolsVersion buildToolsVersion
}

dependencies {
    // Shared liveness engine and face verification (API.md §2.2, §16); api so app and clientmanager see their types
    api 'com.github.Incertainty-Labs.mosip-face-liveness:liveness-core:v0.1.2'
    api 'com.github.Incertainty-Labs.mosip-face-liveness:face-verification:v0.1.2'
    // liveness-core compiles against ONNX Runtime but does not ship it; Android supplies the runtime
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.28.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
