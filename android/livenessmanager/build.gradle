plugins {
    id 'com.android.library'
}

apply from: '../jacoco.gradle'

android {
    lintOptions {
        abortOnError false
        ignoreWarnings true
    }
    namespace 'io.mosip.registration.livenessmanager'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            testCoverageEnabled true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildToolsVersion buildToolsVersion
    // ONNX models are read whole into memory for ModelRegistry's hash checks; store them uncompressed
    androidResources {
        noCompress 'onnx'
    }
    testOptions {
        unitTests {
            // Robolectric tests read this module's strings and layouts
            includeAndroidResources = true
        }
    }
}

dependencies {
    // Shared liveness engine and face verification (API.md §2.2, §16); api so app and clientmanager see their types
    api "com.github.Incertainty-Labs.mosip-face-liveness:liveness-core:${rootProject.ext.livenessVersion}"
    api "com.github.Incertainty-Labs.mosip-face-liveness:face-verification:${rootProject.ext.livenessVersion}"
    // liveness-core compiles against ONNX Runtime but does not ship it; Android supplies the runtime
    implementation "com.microsoft.onnxruntime:onnxruntime-android:${rootProject.ext.onnxruntimeAndroidVersion}"
    // Reads the model bundle's models.json (B-07); the same Jackson as the rest of the app
    implementation "com.fasterxml.jackson.core:jackson-databind:${rootProject.ext.jacksonVersion}"
    // Front camera preview and analysis frames for LivenessActivity (B-04)
    implementation "androidx.camera:camera-core:${rootProject.ext.cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${rootProject.ext.cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${rootProject.ext.cameraxVersion}"
    implementation "androidx.camera:camera-view:${rootProject.ext.cameraxVersion}"
    // ComponentActivity: a lifecycle owner for CameraX and the camera permission request
    implementation "androidx.activity:activity:${rootProject.ext.activityVersion}"
    testImplementation "junit:junit:${rootProject.ext.junitVersion}"
    testImplementation "org.robolectric:robolectric:${rootProject.ext.robolectricVersion}"
    testImplementation "org.mockito:mockito-core:${rootProject.ext.mockitoCoreVersion}"
    testImplementation "androidx.test:core:${rootProject.ext.androidxTestCoreVersion}"
    androidTestImplementation "androidx.test.ext:junit:${rootProject.ext.androidxJunitVersion}"
    androidTestImplementation "androidx.test:runner:${rootProject.ext.androidxTestRunnerVersion}"
}
